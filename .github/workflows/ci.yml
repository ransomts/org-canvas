name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base: a PR stacked on another
  # branch got no run at all under `branches: [main]`, and main's
  # protection requires these checks on the head commit (PR #259).
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — weekly mutation ratchet
  workflow_dispatch:
    inputs:
      mutation:
        description: "Also run the mutation ratchet (about 90 minutes)"
        type: boolean
        default: false

# One run per pull request: a new push cancels the run of the one
# before.  Runs on main (pushes, the weekly mutation ratchet, manual
# dispatches) each get a group of their own, so none cancels or queues
# behind another.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Emacs 30.1 runs the whole suite in one job: it is the fast one
  # (about 50 s) and the one Codecov's coverage and test results come
  # from, which a single report keeps simple.
  test-30:
    name: test (30.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Emacs, Eldev and pandoc
        uses: ./.github/actions/setup-emacs-env
        with:
          emacs-version: '30.1'
          cache-purpose: coverage
          pandoc: "true"

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          eldev test -u "on,codecov,dontsend" -U coverage/coverage.json
        env:
          ELDEV_JUNIT: 1
          JUNIT_REPORT_FILE: test-results.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.json
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results.xml
          report_type: test_results
          fail_ci_if_error: false
          verbose: true

  # Emacs 31 is the current stable series and the leg on the leading
  # edge: 30.1's stricter checkdoc (third-person verbs, long docstring
  # lines) was the kind of change only a new major brings, and 31 is
  # next.  Its suite runs about as fast as 30.1's, so one job takes it,
  # and the linter rides along on the same setup: a 31-only complaint
  # lands here without a second runner's setup cost.
  test-31:
    name: test (31.1) and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Emacs, Eldev and pandoc
        uses: ./.github/actions/setup-emacs-env
        with:
          emacs-version: '31.1'
          # The linter runs off the suite's packages, in the same .eldev.
          cache-purpose: suite
          pandoc: "true"

      - name: Run tests
        run: eldev test

      - name: Run linter
        # A failing test must not hide the lint result: both report.
        if: ${{ !cancelled() }}
        run: eldev lint

  # Emacs 29.x took 100-160 s for the suite alone, so it runs in three
  # shards per version (.github/workflows/test-shards.yml); the
  # aggregator below reports under the check names branch protection
  # requires.
  shards-293:
    uses: ./.github/workflows/test-shards.yml
    with:
      emacs-version: '29.3'

  shards-294:
    uses: ./.github/workflows/test-shards.yml
    with:
      emacs-version: '29.4'

  test-29:
    name: test (${{ matrix.emacs-version }})
    needs: [shards-293, shards-294]
    # Always, so a failed or cancelled shard reports as a failed check
    # rather than a skipped one, which branch protection counts as passed.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    strategy:
      fail-fast: false
      matrix:
        include:
          - emacs-version: '29.3'
            shards: shards-293
          - emacs-version: '29.4'
            shards: shards-294

    steps:
      - name: Every shard passed
        run: |
          result='${{ needs[matrix.shards].result }}'
          echo "Emacs ${{ matrix.emacs-version }} shards: $result"
          [ "$result" = success ]

  generated-artifacts:
    # Guards single-source-of-truth: regenerate committed generated files and
    # fail if they drift from their source. The Canvas contract fixture is
    # derived from the OpenAPI spec; regenerating must be a no-op.  The
    # GraphQL fixture (test/contract/canvas-graphql-contract.json, #269) is
    # not regenerated here: its source is the instance's introspection or a
    # canvas-lms SDL, neither in the repo.  The GraphQL contract test reads
    # the committed fixture and fails on a document that names what the
    # fixture lacks, which is the cue to regenerate (test/contract/README.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Regenerate Canvas contract fixture
        run: python3 test/contract/extract-canvas-contract.py

      - name: Fail if the fixture is out of date
        run: |
          if ! git diff --exit-code test/contract/canvas-contract.json; then
            echo "::error::canvas-contract.json is stale. Re-run:"
            echo "  python3 test/contract/extract-canvas-contract.py"
            echo "and commit the result."
            exit 1
          fi

      - name: Check changelog fragments
        # Each PR adds changelog.d/<issue>.org instead of editing
        # CHANGELOG.org; a malformed one would only fail at release.
        run: python3 scripts/changelog-collect.py --check

      - name: Check user stories
        # The story catalogue must not rot: every command a story names
        # stays in the manual, every autoloaded command stays in the
        # manual, and the story format holds (user-stories.org,
        # "Keeping this file true").
        run: python3 scripts/stories-check.py

  isolation-shards:
    # Every test file must pass on its own: `eldev test "pattern"` is
    # the documented way to run a subset, and the full suite hides what
    # a file borrows from the files loaded before it (issue #260).
    uses: ./.github/workflows/test-shards.yml
    with:
      emacs-version: '30.1'
      each-file: true

  isolation:
    needs: isolation-shards
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Every shard passed
        run: |
          echo "Isolation shards: ${{ needs.isolation-shards.result }}"
          [ "${{ needs.isolation-shards.result }}" = success ]

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Emacs and Eldev
        uses: ./.github/actions/setup-emacs-env
        with:
          emacs-version: '30.1'
          cache-purpose: lint

      - name: Run linter
        run: eldev lint

  complexity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Emacs and Eldev
        uses: ./.github/actions/setup-emacs-env
        with:
          emacs-version: '30.1'
          cache-purpose: complexity

      - name: Check cognitive complexity
        run: |
          output=$(eldev complexity 2>&1) || true
          echo "$output"
          violations=$(echo "$output" | grep -oP '\d+(?= above cognitive threshold)' || echo "0")
          if [ "$violations" -gt 2 ]; then
            echo "BLOCKED: $violations function(s) above threshold (budget: 2)."
            exit 1
          fi

  mutation:
    # Assertion-depth ratchet.  Every file in the baseline gets a FULL
    # pass gated on `test/mutation/accepted-survivors.txt': the job
    # fails only on a survivor that is not in that file, never on the
    # (noisy, sampled) score -- see test/mutation/README.md.
    #
    # The pass is sharded because a full run over all nine files is
    # ~1,060 mutations at ~20s each, more than one runner can do inside
    # the 90-minute budget at --jobs 3.  Each shard covers a disjoint,
    # balanced set of files and checks the same baseline; `--baseline'
    # only treats an entry as stale when this run covered its site, so
    # shards do not report each other's entries as stale.
    #
    # Scheduled weekly, or dispatched by hand with the `mutation' input
    # set; never blocks PRs.  A plain dispatch -- a CI run on a branch
    # that has no pull request -- must not burn the 90 minutes.
    strategy:
      # One shard failing must not cancel the others: the survivors it
      # reports are the useful output, and every shard's report is
      # uploaded.
      fail-fast: false
      matrix:
        shard:
          - name: files
            files: lisp/org-canvas-files.el
          - name: sections
            files: lisp/org-canvas-sections.el
          - name: validate
            files: >-
              lisp/org-canvas-validate.el
              lisp/org-canvas-validate-issue.el
              lisp/org-canvas-validate-content.el
              lisp/org-canvas-validate-grading.el
          - name: sync-push-heading
            files: >-
              lisp/org-canvas-core-sync.el
              lisp/org-canvas-core-push.el
              lisp/org-canvas-core-heading.el
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mutation)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Emacs and Eldev
        uses: ./.github/actions/setup-emacs-env
        with:
          emacs-version: '30.1'
          cache-purpose: suite

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Full pass gated on the accepted-survivors baseline (${{ matrix.shard.name }})
        # Fails only on a survivor absent from the baseline.  Stale
        # entries (accepted but no longer surviving) are reported, not
        # failed -- see test/mutation/README.md for why, including the
        # ~1-spurious-kill-per-pass hazard (#44) that makes any
        # score-based gate on a full pass unreliable.
        run: |
          python3 test/mutation/mutate.py \
            --files ${{ matrix.shard.files }} \
            --max 0 --jobs 3 --timeout 120 \
            --baseline test/mutation/accepted-survivors.txt \
            --json "mutation-baseline-${{ matrix.shard.name }}.json"

      - name: Upload mutation results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: mutation-result-${{ matrix.shard.name }}
          path: mutation-baseline-${{ matrix.shard.name }}.json
