name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        emacs-version: ['29.3', '29.4', '30.1']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emacs
        uses: jcs090218/setup-emacs@a5b1cbb1af335d2e7bef99c0aa6e02cdad229182
        with:
          version: ${{ matrix.emacs-version }}

      - name: Setup Eldev
        uses: emacs-eldev/setup-eldev@v1

      - name: Cache Eldev dependencies
        uses: actions/cache@v4
        with:
          path: .eldev
          key: eldev-${{ matrix.emacs-version }}-${{ hashFiles('Eldev') }}

      - name: Run tests with coverage
        run: |
          if [ "${{ matrix.emacs-version }}" = "30.1" ]; then
            mkdir -p coverage
            eldev test -u "on,codecov,dontsend" -U coverage/coverage.json
          else
            eldev test
          fi
        env:
          ELDEV_JUNIT: 1
          JUNIT_REPORT_FILE: test-results.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.emacs-version == '30.1'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.json
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() && matrix.emacs-version == '30.1' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results.xml
          report_type: test_results
          fail_ci_if_error: false
          verbose: true

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emacs
        uses: jcs090218/setup-emacs@a5b1cbb1af335d2e7bef99c0aa6e02cdad229182
        with:
          version: '30.1'

      - name: Setup Eldev
        uses: emacs-eldev/setup-eldev@v1

      - name: Cache Eldev dependencies
        uses: actions/cache@v4
        with:
          path: .eldev
          key: eldev-30.1-${{ hashFiles('Eldev') }}

      - name: Run linter
        run: eldev lint

  complexity:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emacs
        uses: jcs090218/setup-emacs@a5b1cbb1af335d2e7bef99c0aa6e02cdad229182
        with:
          version: '30.1'

      - name: Setup Eldev
        uses: emacs-eldev/setup-eldev@v1

      - name: Cache Eldev dependencies
        uses: actions/cache@v4
        with:
          path: .eldev
          key: eldev-30.1-${{ hashFiles('Eldev') }}

      - name: Check cognitive complexity
        run: |
          output=$(eldev complexity 2>&1) || true
          echo "$output"
          violations=$(echo "$output" | grep -oP '\d+(?= above cognitive threshold)' || echo "0")
          if [ "$violations" -gt 2 ]; then
            echo "BLOCKED: $violations function(s) above threshold (budget: 2)."
            exit 1
          fi
