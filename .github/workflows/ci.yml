name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base: a PR stacked on another
  # branch got no run at all under `branches: [main]`, and main's
  # protection requires these checks on the head commit (PR #259).
  pull_request:
  # The weekly mutation ratchet lives in mutation.yml, so this
  # workflow's badge reports only what gates a merge (#677).
  workflow_dispatch:

# One run per pull request: a new push cancels the run of the one
# before.  Runs on main (pushes, manual dispatches) each get a group of
# their own, so none cancels or queues behind another.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Emacs 30.2 runs the whole suite in one job: it is the fast one
  # (about 50 s) and the one Codecov's coverage and test results come
  # from, which a single report keeps simple.
  test-30:
    name: test (30.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Emacs, Eldev and pandoc
        uses: ./.github/actions/setup-emacs-env
        with:
          emacs-version: '30.2'
          cache-purpose: coverage
          pandoc: "true"

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          eldev test -u "on,codecov,dontsend" -U coverage/coverage.json
        env:
          ELDEV_JUNIT: 1
          JUNIT_REPORT_FILE: test-results.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.json
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results.xml
          report_type: test_results
          fail_ci_if_error: false
          verbose: true

  # Emacs 31 is the current stable series and the leg on the leading
  # edge: the 30 series' stricter checkdoc (third-person verbs, long
  # docstring lines) was the kind of change only a new major brings, and
  # 31 is next.  Its suite runs about as fast as the 30.x job's, so one job takes
  # and the linter rides along on the same setup: a 31-only complaint
  # lands here without a second runner's setup cost.
  test-31:
    name: test (31.1) and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Emacs, Eldev and pandoc
        uses: ./.github/actions/setup-emacs-env
        with:
          emacs-version: '31.1'
          # The linter runs off the suite's packages, in the same .eldev.
          cache-purpose: suite
          pandoc: "true"

      - name: Run tests
        run: eldev test

      - name: Run linter
        # A failing test must not hide the lint result: both report.
        if: ${{ !cancelled() }}
        run: eldev lint

  # Emacs 29.x took 100-160 s for the suite alone, so it runs in three
  # shards per version (.github/workflows/test-shards.yml); the
  # aggregator below reports under the check names branch protection
  # requires.
  shards-293:
    uses: ./.github/workflows/test-shards.yml
    with:
      emacs-version: '29.3'

  shards-294:
    uses: ./.github/workflows/test-shards.yml
    with:
      emacs-version: '29.4'

  test-29:
    name: test (${{ matrix.emacs-version }})
    needs: [shards-293, shards-294]
    # Always, so a failed or cancelled shard reports as a failed check
    # rather than a skipped one, which branch protection counts as passed.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    strategy:
      fail-fast: false
      matrix:
        include:
          - emacs-version: '29.3'
            shards: shards-293
          - emacs-version: '29.4'
            shards: shards-294

    steps:
      - name: Every shard passed
        run: |
          result='${{ needs[matrix.shards].result }}'
          echo "Emacs ${{ matrix.emacs-version }} shards: $result"
          [ "$result" = success ]

  generated-artifacts:
    # Guards single-source-of-truth: regenerate committed generated files and
    # fail if they drift from their source. The Canvas contract fixture is
    # derived from the OpenAPI spec; regenerating must be a no-op.  The
    # GraphQL fixture (test/contract/canvas-graphql-contract.json, #269) is
    # not regenerated here: its source is the instance's introspection or a
    # canvas-lms SDL, neither in the repo.  The GraphQL contract test reads
    # the committed fixture and fails on a document that names what the
    # fixture lacks, which is the cue to regenerate (test/contract/README.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The branch-fragment check below compares an integration/
          # branch against its base, which needs more than the merge
          # commit this job otherwise reads.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Regenerate Canvas contract fixture
        run: python3 test/contract/extract-canvas-contract.py

      - name: Fail if the fixture is out of date
        run: |
          if ! git diff --exit-code test/contract/canvas-contract.json; then
            echo "::error::canvas-contract.json is stale. Re-run:"
            echo "  python3 test/contract/extract-canvas-contract.py"
            echo "and commit the result."
            exit 1
          fi

      - name: Check changelog fragments
        # Each PR adds changelog.d/<issue>.org instead of editing
        # CHANGELOG.org; a malformed one would only fail at release.
        run: python3 scripts/changelog-collect.py --check

      - name: Check the version header matches the last release
        # `scripts/release.py' bumps both together; a pull request that
        # touches one and not the other would ship a package whose
        # `org-canvas-version' disagrees with CHANGELOG.org (issue #627).
        run: python3 scripts/release.py --check

      - name: Check the branch's own changelog fragment
        # The step above validates every fragment; this one checks that
        # the branch brought the fragment it promises.  A branch named
        # for an issue must bring that issue's fragment.  An
        # integration/ branch carries a date rather than an issue in
        # its name and lands several issues at once, so it must bring
        # at least one new fragment instead (issue #598).
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 scripts/changelog-collect.py \
            --branch-check "$HEAD_REF" --base "origin/$BASE_REF"

      - name: Check user stories
        # The story catalogue must not rot: every command a story names
        # stays in the manual, every autoloaded command stays in the
        # manual, and the story format holds (user-stories.org,
        # "Keeping this file true").
        run: python3 scripts/stories-check.py

      - name: Check API replies are treated as vectors
        # Canvas sends a JSON array, `json-read' hands back a vector, so
        # `car', `nth', `last' or `dolist' on a whole reply fails on a
        # real course while a spec mocking the reply as a list passes
        # (issue #625).
        run: python3 scripts/api-reply-list-check.py

  isolation-shards:
    # Every test file must pass on its own: `eldev test "pattern"` is
    # the documented way to run a subset, and the full suite hides what
    # a file borrows from the files loaded before it (issue #260).
    uses: ./.github/workflows/test-shards.yml
    with:
      emacs-version: '30.2'
      each-file: true

  isolation:
    needs: isolation-shards
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Every shard passed
        run: |
          echo "Isolation shards: ${{ needs.isolation-shards.result }}"
          [ "${{ needs.isolation-shards.result }}" = success ]

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Emacs and Eldev
        uses: ./.github/actions/setup-emacs-env
        with:
          emacs-version: '30.2'
          cache-purpose: lint

      - name: Run linter
        run: eldev lint

      - name: Byte-compile with warnings as errors
        # `eldev lint` misses what the byte-compiler reports (docstring
        # width, forward references, unused bindings).  `-s main` keeps
        # scripts/ out of the fileset: a bare `eldev compile` would run
        # the mutation script (issue #626).  `-F` recompiles everything
        # so the gate cannot pass on stale .elc files.
        run: eldev compile -s main -W -F

  complexity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Emacs and Eldev
        uses: ./.github/actions/setup-emacs-env
        with:
          emacs-version: '30.2'
          cache-purpose: complexity

      - name: Check cognitive complexity
        run: |
          output=$(eldev complexity 2>&1) || true
          echo "$output"
          violations=$(echo "$output" | grep -oP '\d+(?= above cognitive threshold)' || echo "0")
          if [ "$violations" -gt 0 ]; then
            echo "BLOCKED: $violations function(s) above threshold (budget: 0)."
            exit 1
          fi
